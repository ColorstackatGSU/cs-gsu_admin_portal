<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/colorstack-gsu-logo.png" />
    <meta name="description" content="Internal officer portal for ColorStack at Georgia State University." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Same three families as the sponsor portal: Archivo Black for display,
         Space Grotesk for UI text, Space Mono for money, dates and IDs. The two
         apps are one family and have to be set in the same type.

         Archivo (the variable width axis, distinct from Archivo Black) is the
         Tech League's display face, used only inside .tl-scope. It is requested
         here because that is the only place fonts are requested, but the woff2
         itself is only fetched once something on the page actually matches the
         family, so pages outside that scope pay nothing for it. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wdth,wght@100..125,600..700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#FBF4E4" />
    <title>Admin Portal | ColorStack at GSU</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
